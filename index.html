<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mana Inti Vanta - Upal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EA580C">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff8f0;font-family:system-ui}
header{background:#0f7a3f;color:#fff;padding:12px;text-align:center}
.hero{background:#0a5a2e;color:#fff;padding:20px;text-align:center}
.tabs{display:flex;gap:8px;padding:12px;overflow:auto}
.tab{padding:8px 14px;border-radius:20px;border:1px solid #0f7a3f;background:#fff;color:#0f7a3f}
.tab.active{background:#ff6b00;color:#fff;border-color:#ff6b00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:100px;object-fit:cover}
.card-body{padding:10px}
.price{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.add{background:#0f7a3f;color:#fff;border:0;padding:6px 12px;border-radius:8px}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;display:flex;justify-content:space-between;box-shadow:0 -2px 10px rgba(0,0,0,.1)}
.order{background:#ff6b00;color:#fff;border:0;padding:10px 20px;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<header><img src="IMG-20261116-WA0231.jpg" style="width:50px;height:50px;border-radius:50%;border:2px solid white;margin-right:10px;vertical-align:middle;"><b>Mana Inti Vanta 🍛<br><small>Upal, Hyderabad - 8143184265</small></b></header>
<div class="hero"><h2>Roju Tiffins & Meals</h2><p>Fresh ga inti vantalu</p></div>
<div class="tabs"><button class="tab active" onclick="filter('all')">Anni</button><button class="tab" onclick="filter('tiffin')">Tiffins</button><button class="tab" onclick="filter('meals')">Meals</button><button class="tab" onclick="filter('curry')">Curries</button></div>
<div class="grid" id="grid"></div>
<div class="footer"><div><h3 id="total">₹0</h3><small id="count">0 items</small></div><button class="order" onclick="order()">WhatsApp Order</button></div>
<script>
let cart=[];let total=0;
let items=[{name:"Idli (4)",price:40,cat:"tiffin",img:"https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=300"},{name:"Dosa",price:50,cat:"tiffin",img:"https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=300"},{name:"Puri (3)",price:50,cat:"tiffin",img:"https://images.unsplash.com/photo-1606491956689-2ea866880c84?w=300"},{name:"Veg Meals",price:120,cat:"meals",img:"https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=300"},{name:"Chicken Curry",price:150,cat:"curry",img:"https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=300"},{name:"Paneer Curry",price:130,cat:"curry",img:"https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=300"}];
function render(list=items){let g=document.getElementById('grid');g.innerHTML='';list.forEach((it,i)=>{g.innerHTML+=`<div class="card"><img src="${it.img}"><div class="card-body"><b>${it.name}</b><div class="price"><span>₹${it.price}</span><button class="add" onclick="add(${i})">Add</button></div></div></div>`})}
function filter(c){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active');if(c=='all')render();else render(items.filter(x=>x.cat==c))}
function add(i){cart.push(items[i]);total+=items[i].price;document.getElementById('total').innerText='₹'+total;document.getElementById('count').innerText=cart.length+' items';}
function order(){if(cart.length==0){alert('Cart empty!');return;}let msg='Namaste! Order:%0A';cart.forEach(x=>msg+=x.name+' - ₹'+x.price+'%0A');msg+='Total: ₹'+total;window.open('https://wa.me/918143184265?text='+msg)}
render();
</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
